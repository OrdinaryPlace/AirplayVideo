name: AirplayVideo
version: "0.2.4"
slug: airplayvideo
description: Send browser pages, live TV or generated videos to your Apple TVs
url: https://github.com/OrdinaryPlace/AirplayVideo
arch: [amd64]
startup: application
boot: manual
init: true
host_network: true
timeout: 30
ingress: true
ingress_port: 0
ingress_stream: true
panel_icon: mdi:cast-connected
panel_title: AirplayVideo
panel_admin: true
hassio_api: true
hassio_role: default
services: [mqtt:want]
video: true
# Chrome's sandbox creates nested namespaces. Keep HA protection and the
# browser sandbox enabled; do not replace this with --no-sandbox.
privileged: [SYS_ADMIN]
stage: experimental
# Host networking is required for LAN mDNS and HDHomeRun broadcast discovery.
# The web listener uses Supervisor's assigned ingress port on its bridge only;
# private control listeners use dynamically allocated loopback ports.
options: {}
schema: {}
