name: AirplayVideo
version: "0.1.3"
slug: airplayvideo
description: Send a browser page or HDHomeRun channel to your Apple TVs
url: https://github.com/OrdinaryPlace/AirplayVideo
arch: [amd64]
startup: application
boot: manual
init: true
timeout: 30
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:cast-connected
panel_title: AirplayVideo
panel_admin: true
hassio_api: true
hassio_role: default
services: [mqtt:want]
video: true
# Chrome's sandbox creates nested namespaces. Keep HA protection and the
# browser sandbox enabled; do not replace this with --no-sandbox.
privileged: [SYS_ADMIN]
stage: experimental
ports:
  18200/udp: 18200
  18201/udp: 18201
  18202/udp: 18202
  18203/udp: 18203
  18204/udp: 18204
  18205/udp: 18205
  18206/udp: 18206
  18207/udp: 18207
  18208/udp: 18208
  18209/udp: 18209
  18210/udp: 18210
  18211/udp: 18211
  18212/udp: 18212
  18213/udp: 18213
  18214/udp: 18214
  18215/udp: 18215
